<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadEasy - 瑞典语电子书阅读器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-sepia font-serif">
  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-left">
      <button id="btn-sidebar-toggle" class="icon-btn" title="目录与生词本 (Ctrl+B)">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="book-title-container">
        <span class="book-icon">📖</span>
        <span id="book-title" class="book-title">Änglarnas svar</span>
      </div>
    </div>

    <!-- Mode Selector in Center -->
    <div class="header-center">
      <div class="mode-switch">
        <button id="mode-bilingual" class="mode-btn active" title="左右双文对照阅读">
          <span class="mode-icon">📑</span> 双文对照
        </button>
        <button id="mode-single" class="mode-btn" title="纯瑞典语沉浸阅读">
          <span class="mode-icon">📄</span> 纯瑞典文
        </button>
        <button id="mode-scan" class="mode-btn" title="原版扫描排版阅读">
          <span class="mode-icon">🖼️</span> 原版扫描
        </button>
      </div>
    </div>

    <!-- Controls on Right -->
    <div class="header-right">
      <!-- Font controls -->
      <div class="font-controls">
        <button id="btn-font-dec" class="tool-btn" title="缩小字号">A-</button>
        <span id="font-size-label" class="font-size-text">18</span>
        <button id="btn-font-inc" class="tool-btn" title="放大字号">A+</button>
      </div>

      <!-- Theme Selector -->
      <div class="theme-controls">
        <button class="theme-btn theme-light-btn" data-theme="light" title="日间纯白"></button>
        <button class="theme-btn theme-sepia-btn active" data-theme="sepia" title="舒适羊皮纸"></button>
        <button class="theme-btn theme-dark-btn" data-theme="dark" title="沉浸深色"></button>
      </div>

      <!-- Search button -->
      <button id="btn-search-toggle" class="icon-btn" title="搜索全书">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-layout">
    <!-- Collapsible Sidebar -->
    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="toc">目录章节</button>
        <button class="tab-btn" data-tab="vocab">生词本 <span id="vocab-count-badge" class="badge">0</span></button>
        <button class="tab-btn" data-tab="search">全文搜索</button>
      </div>

      <!-- Tab: Table of Contents -->
      <div id="tab-toc" class="tab-content active">
        <div class="toc-header">
          <span>章节导航</span>
          <span id="toc-total-pages" class="text-muted">共 171 页</span>
        </div>
        <ul id="toc-list" class="toc-list">
          <!-- Populated by JS -->
        </ul>
      </div>

      <!-- Tab: Vocabulary -->
      <div id="tab-vocab" class="tab-content">
        <div class="vocab-header">
          <span>已保存的生词</span>
          <button id="btn-export-vocab" class="small-btn">导出</button>
        </div>
        <ul id="vocab-list" class="vocab-list">
          <!-- Populated by JS -->
        </ul>
      </div>

      <!-- Tab: Search -->
      <div id="tab-search" class="tab-content">
        <div class="search-input-box">
          <input type="text" id="search-query" placeholder="搜索书中单词或句子...">
          <button id="btn-do-search" class="small-btn">搜索</button>
        </div>
        <div id="search-results-count" class="search-count"></div>
        <ul id="search-results-list" class="search-results-list"></ul>
      </div>
    </aside>

    <!-- Main Reader Workspace -->
    <main id="reader-workspace" class="reader-workspace">
      <!-- Floating Navigation Arrows -->
      <button id="btn-prev-page" class="nav-arrow nav-prev" title="上一页 (PageUp / ←)">
        <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button id="btn-next-page" class="nav-arrow nav-next" title="下一页 (PageDown / Space / →)">
        <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Reader Scroll Area -->
      <div id="reader-scroll-container" class="reader-scroll-container">
        <!-- Content will be injected here -->
        <div id="reader-view" class="reader-view view-bilingual">
          <div class="reader-loading">正在加载页面...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bottom Page Navigation Bar -->
  <footer class="app-footer">
    <div class="footer-left">
      <span id="page-status-label" class="page-status-text">第 1 页 / 共 171 页</span>
      <span id="page-percent-label" class="page-percent-text">(0.6%)</span>
    </div>

    <div class="footer-center">
      <button id="footer-prev-btn" class="page-btn">上一页</button>
      <div class="slider-container">
        <input type="range" id="page-slider" min="1" max="171" value="1" step="1">
      </div>
      <button id="footer-next-btn" class="page-btn">下一页</button>
    </div>

    <div class="footer-right">
      <div class="jump-box">
        <span>跳转到第</span>
        <input type="number" id="page-jump-input" min="1" max="171" value="1">
        <span>页</span>
        <button id="btn-jump-go" class="jump-go-btn">前往</button>
      </div>
    </div>
  </footer>

  <!-- Floating Dictionary Popover -->
  <div id="dict-popover" class="dict-popover hidden">
    <div class="popover-arrow"></div>
    <div class="popover-header">
      <div class="popover-word-group">
        <span id="popover-word" class="popover-word">ord</span>
        <span id="popover-pos" class="popover-badge">名词</span>
        <button id="popover-speak-btn" class="popover-icon-btn" title="播放瑞典语发音">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
      </div>
      <div class="popover-actions">
        <button id="popover-save-vocab-btn" class="popover-star-btn" title="加入生词本">⭐ 记生词</button>
      </div>
    </div>

    <div id="popover-lemma-row" class="popover-lemma-row hidden">
      <span class="lemma-label">原形 (Lemma):</span>
      <span id="popover-lemma" class="lemma-text">ord</span>
    </div>

    <div id="popover-phonetic-row" class="popover-phonetic-row hidden">
      <span class="phonetic-label">发音:</span>
      <span id="popover-phonetic" class="phonetic-text">['u:d]</span>
    </div>

    <div class="popover-body">
      <div class="def-section">
        <div class="def-title">中文释义</div>
        <div id="popover-zh-def" class="popover-zh-def">正在查询字典...</div>
      </div>
      <div id="popover-en-section" class="def-section hidden">
        <div class="def-title">英文释义</div>
        <div id="popover-en-def" class="popover-en-def"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
